<!doctype html>
<html><head><meta charset="utf-8"><title>FLA spike</title>
<style>body{margin:0;background:#ddd;font:12px sans-serif}canvas{display:block;background:#fff}</style>
<script src="render.js"></script></head>
<body><div id="out"></div>
<script>
const W = 3000, H = 3000;
async function load(file) { window.doc = await (await fetch(file)).json(); window.R = new FlaRenderer(doc); await loadBrushes(doc.brushes); return Object.keys(doc.symbols).length; }

function stage(frame, scale) {
  const c = document.createElement("canvas");
  c.width = doc.w * scale; c.height = doc.h * scale;
  const ctx = c.getContext("2d");
  ctx.fillStyle = doc.bg; ctx.fillRect(0, 0, c.width, c.height);
  ctx.scale(scale, scale);
  const t0 = performance.now();
  R.drawTimeline(ctx, doc.scenes[0], frame);
  return { c, ms: performance.now() - t0 };
}

// A symbol drawn at the centre of a big canvas; bounds = non-transparent pixels.
function raw(name, frame, scale) {
  const c = new OffscreenCanvas(W, H), ctx = c.getContext("2d");
  ctx.translate(W / 2, H / 2); ctx.scale(scale, scale);
  R.drawTimeline(ctx, doc.symbols[name].tl, frame);
  return c;
}
function bounds(c) {
  const d = c.getContext("2d").getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (d[(y * W + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return x1 < 0 ? null : [x0 - 6, y0 - 6, x1 + 6, y1 + 6];
}
// Several frames of one symbol side by side, cropped to the union of their bounds.
function strip(name, frames, scale) {
  const canv = frames.map((f) => raw(name, f, scale));
  let b = null;
  canv.forEach((c) => { const k = bounds(c); if (k) b = b ? [Math.min(b[0], k[0]), Math.min(b[1], k[1]), Math.max(b[2], k[2]), Math.max(b[3], k[3])] : k; });
  if (!b) return null;
  const w = b[2] - b[0], h = b[3] - b[1];
  const out = document.createElement("canvas");
  out.width = w * frames.length; out.height = h + 18;
  const ctx = out.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, out.width, out.height);
  canv.forEach((c, i) => {
    ctx.drawImage(c, b[0], b[1], w, h, i * w, 18, w, h);
    ctx.fillStyle = "#666"; ctx.fillText("frame " + frames[i], i * w + 4, 12);
  });
  return out;
}
</script></body></html>
