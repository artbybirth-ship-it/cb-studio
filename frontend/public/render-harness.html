<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CB Studio Render Harness</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Mukta:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;600;800&family=Hind:wght@400;600;700&family=Baloo+2:wght@400;600;800&family=Montserrat:wght@400;600;800&family=Roboto:wght@400;700;900&family=Open+Sans:wght@400;600;800&family=Lato:wght@400;700;900&family=Playfair+Display:wght@400;700;900&display=swap" />
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    *{box-sizing:border-box}
    #stage{position:absolute;left:0;top:0;overflow:hidden;background:#fff;font-family:Arial,sans-serif;transform-origin:0 0}
    .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;image-rendering:auto;filter:none}
    .char-layer{position:absolute;transform-origin:50% 50%;pointer-events:none}
    .char-layer iframe{display:block;width:100%;height:100%;border:0;background:transparent;pointer-events:none}
    .text-layer{position:absolute;transform-origin:center;color:#fff;font:800 52px/1.1 Arial,sans-serif;text-shadow:0 2px 8px #000;white-space:pre-wrap}
    .prop-layer{position:absolute;width:130px;height:130px;border-radius:22px;border:4px solid #49c9c7;background:#17343a;color:#dffafa;display:grid;place-items:center;text-align:center;transform-origin:center}
    .image-layer{position:absolute;transform-origin:50% 50%;pointer-events:none}.image-layer img{display:block;width:100%;height:100%;object-fit:contain}
    .prop-layer span{font-size:48px}.prop-layer small{position:absolute;top:136px;font-size:18px;white-space:nowrap;color:#dffafa}
    #fatal{position:absolute;inset:0;display:none;place-items:center;padding:30px;background:#fff;color:#b91c1c;font:700 18px/1.4 Arial,sans-serif;text-align:center;z-index:999999}
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="fatal"></div>
<script>
(function(){
  'use strict';
  window.__CBS_RENDER_READY__ = false;
  window.__CBS_RENDER_ERROR__ = '';
  window.__CBS_RENDER_BOOTED__ = true;

  var params = new URLSearchParams(location.search);
  var sceneId = params.get('scene') || '';
  var requestedWidth = Math.max(2, Number(params.get('width') || 0));
  var requestedHeight = Math.max(2, Number(params.get('height') || 0));
  var captureScale = Math.max(1, Math.min(4, Number(params.get('scale') || 1)));
  var stage = document.getElementById('stage');
  var fatal = document.getElementById('fatal');
  var characterFrames = [];
  var timedLayers = [];
  var readySources = new Set();
  var pendingImages = 0;
  var pendingSeek = null;
  var seekCounter = 0;
  var stageZoomed = false;
  var currentTimeSeconds = 0;

  function fail(message){
    var text = String(message || 'Unknown render error');
    window.__CBS_RENDER_ERROR__ = text;
    fatal.textContent = text;
    fatal.style.display = 'grid';
    if(pendingSeek){ clearTimeout(pendingSeek.timer); pendingSeek.resolve(); pendingSeek = null; }
    console.error('[CBS render harness]', text);
  }

  function supportsStandardZoom(){
    var host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-9999px;top:0;width:100px;height:100px;visibility:hidden';
    host.innerHTML = '<div style="position:absolute;left:10px;top:0;zoom:2"><div style="width:10px;height:10px"></div></div>';
    document.body.appendChild(host);
    var child = host.firstElementChild.firstElementChild, hostRect = host.getBoundingClientRect(), childRect = child.getBoundingClientRect();
    var ok = Math.abs(childRect.width - 20) < 0.5 && child.offsetWidth === 10 && Math.abs(childRect.left - hostRect.left - 20) < 0.5;
    host.remove();
    return ok;
  }

  function resolveUrl(url){
    try { return new URL(url, location.origin).toString(); }
    catch(_e){ return url; }
  }

  async function fetchJson(url){
    var response = await fetch(url, {cache:'no-store'});
    if(!response.ok) throw new Error(url + ' -> HTTP ' + response.status);
    return response.json();
  }

  function addBackground(url, opacity, z){
    if(!url) return;
    var img = document.createElement('img');
    img.className = 'bg';
    pendingImages += 1;
    img.src = resolveUrl(url);
    img.style.opacity = String(opacity == null ? 1 : opacity);
    img.style.zIndex = String(z);
    img.onload = function(){ pendingImages = Math.max(0, pendingImages - 1); markReadyWhenPossible(); };
    img.onerror = function(){ pendingImages = Math.max(0, pendingImages - 1); fail('Background image failed to load: ' + url); };
    stage.appendChild(img);
  }

  // Text layer fonts: keep in sync with lib/fonts.ts (FONT_OPTIONS).
  var FONT_CSS = {"Arial":"Arial, Helvetica, sans-serif","Poppins":"'Poppins', sans-serif","Mukta":"'Mukta', sans-serif","Noto Sans Devanagari":"'Noto Sans Devanagari', sans-serif","Hind":"'Hind', sans-serif","Baloo 2":"'Baloo 2', cursive","Montserrat":"'Montserrat', sans-serif","Roboto":"'Roboto', sans-serif","Open Sans":"'Open Sans', sans-serif","Lato":"'Lato', sans-serif","Playfair Display":"'Playfair Display', serif","Georgia":"Georgia, serif","Times New Roman":"'Times New Roman', Times, serif","Verdana":"Verdana, Geneva, sans-serif","Trebuchet MS":"'Trebuchet MS', sans-serif","Courier New":"'Courier New', Courier, monospace","Impact":"Impact, 'Arial Black', sans-serif"};
  function fontCss(name){ var key = name || 'Arial'; return FONT_CSS[key] || ("'" + key + "', Arial, sans-serif"); }

  function addText(object, z){
    var el = document.createElement('div');
    el.className = 'text-layer';
    el.textContent = object.text || object.name || '';
    el.style.color = object.fillColor || '#fff';
    el.style.fontFamily = fontCss(object.fontFamily);
    el.style.fontSize = Number(object.fontSize || 52) + 'px';
    el.style.left = Number(object.x || 0) + 'px';
    el.style.top = Number(object.y || 0) + 'px';
    el.style.opacity = String(object.opacity == null ? 1 : object.opacity);
    el.style.zIndex = String(z);
    el.style.transform = layerTransform(object);
    stage.appendChild(el);
    timedLayers.push({el:el,object:object});
  }

  // Layers draw only inside their time span (StageCanvas): from startTime for actionDurationMs.
  function inTimeSpan(object, seconds){
    var start = Math.max(0, Number(object.startTime || 0));
    var length = object.actionDurationMs ? Math.max(0.1, Number(object.actionDurationMs) / 1000) : null;
    return seconds + 0.0001 >= start && (length == null || seconds <= start + length + 0.0001);
  }
  function updateVisibility(seconds){
    timedLayers.forEach(function(entry){ entry.el.style.visibility = inTimeSpan(entry.object, seconds) ? 'visible' : 'hidden'; });
  }

  // Same transform as the editor canvas (StageCanvas layerTransformCss): rotation, skew, scale with
  // stretch, and the mirror flip (Reflect).
  function layerTransform(object){
    var clamp = function(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); };
    var scale = Number(object.scale || 1);
    var sx = clamp(Number(object.stretchX == null ? 1 : object.stretchX) || 1, 0.02, 50);
    var sy = clamp(Number(object.stretchY == null ? 1 : object.stretchY) || 1, 0.02, 50);
    var kx = clamp(Number(object.skewX || 0), -80, 80), ky = clamp(Number(object.skewY || 0), -80, 80);
    return 'translate(-50%,-50%) rotate(' + Number(object.rotation || 0) + 'deg) skew(' + kx + 'deg,' + ky + 'deg) scale(' + (scale * sx) + ',' + (scale * sy) + ')' + (object.flipX ? ' scaleX(-1)' : '');
  }

  // Picture layers (Import to Stage, library FX): the real image at its own pixel size, with the
  // layer transform, exactly as the editor draws them (StageCanvas cb-stage-prop-image).
  function addImageLayer(object, z){
    var el = document.createElement('div');
    el.className = 'image-layer';
    el.style.left = Number(object.x || 0) + 'px';
    el.style.top = Number(object.y || 0) + 'px';
    el.style.width = Number(object.sourceWidth || 300) + 'px';
    el.style.height = Number(object.sourceHeight || 300) + 'px';
    el.style.opacity = String(object.opacity == null ? 1 : object.opacity);
    el.style.zIndex = String(z);
    el.style.transform = layerTransform(object);
    var img = document.createElement('img');
    pendingImages += 1;
    img.onload = function(){ pendingImages = Math.max(0, pendingImages - 1); markReadyWhenPossible(); };
    // A missing picture must not stop the whole export: it is left out and reported.
    img.onerror = function(){ pendingImages = Math.max(0, pendingImages - 1); console.error('Picture layer failed to load: ' + object.assetUrl); markReadyWhenPossible(); };
    img.src = resolveUrl(object.assetUrl);
    el.appendChild(img);
    stage.appendChild(el);
    timedLayers.push({el:el,object:object});
  }

  function addProp(object, z){
    var el = document.createElement('div');
    el.className = 'prop-layer';
    el.innerHTML = '<span>◇</span><small></small>';
    el.querySelector('small').textContent = object.name || 'Prop';
    el.style.left = Number(object.x || 0) + 'px';
    el.style.top = Number(object.y || 0) + 'px';
    el.style.opacity = String(object.opacity == null ? 1 : object.opacity);
    el.style.zIndex = String(z);
    if (object.fillColor) el.style.background = object.fillColor;
    el.style.transform = layerTransform(object);
    stage.appendChild(el);
    timedLayers.push({el:el,object:object});
  }

  // ---- Characters are laid out exactly like the editor (StageCanvas): a box centred on the
  // character's position, sourceWidth × sourceHeight × scale × stretch, rotated / skewed / flipped
  // about its centre, with the player filling it. Keep in sync with lib/keyframes.ts and
  // lib/partKeyframes.ts.
  var KEY_EPSILON = 1 / 120;
  function byTime(frames){ return (Array.isArray(frames) ? frames.slice() : []).sort(function(a,b){return Number(a.time||0)-Number(b.time||0);}); }
  function easeProgress(t, easeIn, easeOut){
    var i = Math.max(0, Math.min(1, Number(easeIn || 0) / 100)), o = Math.max(0, Math.min(1, Number(easeOut || 0) / 100));
    var y1 = (1 - i) / 3, y2 = 1 - (1 - o) / 3, u = 1 - t;
    return 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t;
  }
  function resolveCharacterTransform(object, seconds){
    var base={x:Number(object.x||0),y:Number(object.y||0),scale:Number(object.scale||1),rotation:Number(object.rotation||0)};
    var frames=byTime(object.keyframes);
    if(!frames.length)return base;
    var t=Math.max(0,Number(seconds||0)),first=frames[0],last=frames[frames.length-1];
    var at=function(f){return{x:Number(f.x||0),y:Number(f.y||0),scale:base.scale,rotation:base.rotation};};
    if(t<=Number(first.time||0)+KEY_EPSILON)return at(first);
    if(t>=Number(last.time||0)-KEY_EPSILON)return at(last);
    for(var i=0;i<frames.length-1;i++){
      var left=frames[i],right=frames[i+1],lt=Number(left.time||0),rt=Number(right.time||0);
      if(t<lt-KEY_EPSILON||t>rt+KEY_EPSILON)continue;
      // No tween: the position holds until the next keyframe (Animate).
      if(left.tween===false)return at(left);
      var linear=Math.max(0,Math.min(1,(t-lt)/Math.max(KEY_EPSILON,rt-lt)));
      var r=left.tween?easeProgress(linear,left.tween.easeIn,left.tween.easeOut):linear;
      return{x:Number(left.x||0)+(Number(right.x||0)-Number(left.x||0))*r,y:Number(left.y||0)+(Number(right.y||0)-Number(left.y||0))*r,scale:base.scale,rotation:base.rotation};
    }
    return base;
  }

  // Part edits with their part keyframes at a time (lib/partKeyframes.ts resolvePartOverridesAtTime).
  function partEase(value, mode){
    var t = Math.max(0, Math.min(1, value));
    if(mode === 'linear') return t;
    if(mode === 'easeIn') return t * t;
    if(mode === 'easeOut') return 1 - (1 - t) * (1 - t);
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }
  function atLeast(value){ return Math.max(0.02, Number(value == null ? 1 : value) || 1); }
  function resolvePartTransform(object, key, seconds){
    var o = (object.partOverrides && object.partOverrides[key]) || {};
    var base = {offsetX:Number(o.offsetX||0), offsetY:Number(o.offsetY||0), rotation:Number(o.rotation||0), scale:Math.max(0.02, Number(o.scale == null ? 1 : o.scale)), flipX:!!o.flipX, skewX:Number(o.skewX||0), skewY:Number(o.skewY||0), stretchX:atLeast(o.stretchX), stretchY:atLeast(o.stretchY)};
    var frames = byTime(object.partKeyframes && object.partKeyframes[key]);
    if(!frames.length) return base;
    var t = Math.max(0, Number(seconds || 0));
    if(t < frames[0].time - KEY_EPSILON) return base;
    var num = function(v){ return Number(v || 0); };
    var last = frames[frames.length - 1];
    if(t >= last.time - KEY_EPSILON){
      return {offsetX:base.offsetX + num(last.offsetX), offsetY:base.offsetY + num(last.offsetY), rotation:base.rotation + num(last.rotation), scale:base.scale * Math.max(0.02, Number(last.scale == null ? 1 : last.scale)),
        flipX:typeof last.flipX === 'boolean' ? last.flipX : base.flipX, skewX:base.skewX + num(last.skewX), skewY:base.skewY + num(last.skewY),
        stretchX:base.stretchX * Math.max(0.02, Number(last.stretchX == null ? 1 : last.stretchX)), stretchY:base.stretchY * Math.max(0.02, Number(last.stretchY == null ? 1 : last.stretchY))};
    }
    for(var i = 0; i < frames.length - 1; i++){
      var l = frames[i], r = frames[i + 1];
      if(t < l.time - KEY_EPSILON || t > r.time + KEY_EPSILON) continue;
      var k = partEase((t - l.time) / Math.max(KEY_EPSILON, r.time - l.time), r.easing || l.easing);
      var lerp = function(a, b){ return a + (b - a) * k; };
      var fs = function(f){ return Math.max(0.02, Number(f.scale == null ? 1 : f.scale)); };
      var fst = function(f, axis){ return Math.max(0.02, Number(f[axis] == null ? 1 : f[axis])); };
      var leftFlip = typeof l.flipX === 'boolean' ? l.flipX : base.flipX;
      return {offsetX:base.offsetX + lerp(num(l.offsetX), num(r.offsetX)), offsetY:base.offsetY + lerp(num(l.offsetY), num(r.offsetY)), rotation:base.rotation + lerp(num(l.rotation), num(r.rotation)),
        scale:base.scale * lerp(fs(l), fs(r)), skewX:base.skewX + lerp(num(l.skewX), num(r.skewX)), skewY:base.skewY + lerp(num(l.skewY), num(r.skewY)),
        stretchX:base.stretchX * lerp(fst(l, 'stretchX'), fst(r, 'stretchX')), stretchY:base.stretchY * lerp(fst(l, 'stretchY'), fst(r, 'stretchY')),
        // Flip is discrete: the new state starts exactly on the right-hand keyframe.
        flipX:t >= r.time - KEY_EPSILON ? (typeof r.flipX === 'boolean' ? r.flipX : leftFlip) : leftFlip};
    }
    return base;
  }
  function resolvePartOverrides(object, seconds){
    var keys = {}, result = {};
    Object.keys(object.partOverrides || {}).concat(Object.keys(object.partKeyframes || {})).forEach(function(key){ keys[key] = true; });
    Object.keys(keys).forEach(function(key){ result[key] = Object.assign({}, (object.partOverrides && object.partOverrides[key]) || {}, resolvePartTransform(object, key, seconds)); });
    return result;
  }

  // The source animation's time for a layer (lib/partKeyframes.ts resolveSourceSeekMs).
  function resolveSourceSeekMs(object, seconds){
    var localTime = Math.max(0, seconds - Math.max(0, Number(object.startTime || 0)));
    var clips = byTime((object.sourceAnimationClips || []).map(function(c){ return Object.assign({}, c, {time:c.start}); }));
    if(!clips.length) return localTime * 1000;
    var active = clips.find(function(c){ return localTime >= c.start && localTime < c.start + c.duration; });
    return active ? Math.max(0, (localTime - active.start) * 1000) : 0;
  }

  function placeCharacter(entry, seconds){
    var object = entry.object, transform = resolveCharacterTransform(object, seconds);
    var clamp = function(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); };
    var sx = clamp(Number(object.stretchX == null ? 1 : object.stretchX) || 1, 0.02, 50);
    var sy = clamp(Number(object.stretchY == null ? 1 : object.stretchY) || 1, 0.02, 50);
    var kx = clamp(Number(object.skewX || 0), -80, 80), ky = clamp(Number(object.skewY || 0), -80, 80);
    var scale = transform.scale || 0.28, s = entry.layer.style;
    var w = Number(object.sourceWidth || 1920) * scale * sx, h = Number(object.sourceHeight || 1920) * scale * sy;
    // Centred with margins, not translate(-50%,-50%): no transform at all for an upright character,
    // so its bitmap is never resampled (StageCanvas characterBoxCss / characterTransformCss).
    s.left = transform.x + 'px'; s.top = transform.y + 'px';
    s.width = w + 'px'; s.height = h + 'px';
    s.marginLeft = (-w / 2) + 'px'; s.marginTop = (-h / 2) + 'px';
    var rotation = transform.rotation || 0;
    s.transform = rotation || kx || ky || object.flipX ? 'rotate(' + rotation + 'deg) skew(' + kx + 'deg,' + ky + 'deg) scaleX(' + (object.flipX ? -1 : 1) + ')' : 'none';
    return transform;
  }

  function sendEdits(entry, seconds){
    if(!entry.frame.contentWindow) return;
    var object = entry.object, time = seconds == null ? currentTimeSeconds : seconds;
    var transform = placeCharacter(entry, time);
    entry.frame.contentWindow.postMessage({
      source:'characterbazaarstudio-editor',
      type:'CHARACTER_EDITS',
      partOverrides:resolvePartOverrides(object, time),
      colorOverrides:object.colorOverrides || {},
      colorReplacements:object.colorReplacements || [],
      strokeScale:object.strokeScale == null ? 1 : object.strokeScale,
      selectedPart:'',
      focusPart:'',
      viewport:{width:requestedWidth || innerWidth,height:requestedHeight || innerHeight},
      characterTransform:{
        x:transform.x,
        y:transform.y,
        scale:transform.scale,
        rotation:transform.rotation,
        flipX:!!object.flipX
      }
    }, '*');
    // Sharp vectors: draw the whole player at the captured resolution (stage scale × device pixels).
    // Outlines at least 1.5 px of the final (Full HD) video frame, Animate's weight, and seamless joins
    // between touching pieces; the frame is captured at captureScale and scaled down afterwards.
    entry.frame.contentWindow.postMessage({source:'characterbazaarstudio-editor', type:'SET_VIEW', pixelScale:captureScale * Math.max(0.25, Number(window.devicePixelRatio || 1)), x:0, y:0, width:1, height:1, exact:stageZoomed, minStroke:1.5 * captureScale, seal:0.5 * captureScale}, '*');
  }

  function addCharacter(object, z){
    var layer = document.createElement('div');
    layer.className = 'char-layer';
    layer.style.zIndex = String(z);
    layer.style.opacity = String(object.opacity == null ? 1 : object.opacity);
    var frame = document.createElement('iframe');
    var assetUrl = object.assetUrl || '/characters/talking/men/player.html';
    var src = new URL(resolveUrl(assetUrl));
    src.searchParams.set('autoplay','0');
    src.searchParams.set('muted','1');
    src.searchParams.set('interactive','0');
    src.searchParams.set('embeddedMode','1');
    src.searchParams.set('viewportWidth', String(object.sourceWidth || 1920));
    src.searchParams.set('viewportHeight', String(object.sourceHeight || 1920));
    src.searchParams.set('bridge','render-v30');
    frame.src = src.toString();
    var hue = Number(object.characterHue == null ? 0 : object.characterHue);
    var sat = Number(object.characterSaturation == null ? 100 : object.characterSaturation);
    var bright = Number(object.characterBrightness == null ? 100 : object.characterBrightness);
    frame.style.filter = 'hue-rotate(' + hue + 'deg) saturate(' + sat + '%) brightness(' + bright + '%)';
    layer.appendChild(frame);
    stage.appendChild(layer);
    var entry = {frame:frame,layer:layer,object:object};
    placeCharacter(entry, 0);
    characterFrames.push(entry);
    timedLayers.push({el:layer,object:object});
  }

  function markReadyWhenPossible(){
    if(window.__CBS_RENDER_ERROR__) return;
    if(pendingImages > 0) return;
    if(readySources.size < characterFrames.length) return;
    // Text fonts must be loaded before capture (Google fonts arrive asynchronously).
    if(document.fonts && document.fonts.status !== 'loaded' && !markReadyWhenPossible.fontsWaited){ markReadyWhenPossible.fontsWaited = true; document.fonts.ready.then(markReadyWhenPossible, markReadyWhenPossible); return; }
    characterFrames.forEach(function(entry){sendEdits(entry,currentTimeSeconds);});
    requestAnimationFrame(function(){requestAnimationFrame(function(){window.__CBS_RENDER_READY__ = true;});});
  }

  window.addEventListener('message', function(event){
    var data = event.data;
    if(!data || data.source !== 'characterbazaarstudio-animate') return;
    if(data.type === 'ERROR') { fail(data.message || 'Talking player runtime error'); return; }
    if(data.type === 'READY') {
      if(event.source) readySources.add(event.source);
      var entry = characterFrames.find(function(item){ return item.frame.contentWindow === event.source; });
      if(entry) sendEdits(entry,currentTimeSeconds);
      markReadyWhenPossible();
      return;
    }
    if(data.type === 'SEEK_DONE' && pendingSeek){
      if(data.token !== pendingSeek.token) return;
      if(event.source) pendingSeek.sources.add(event.source);
      if(pendingSeek.sources.size >= characterFrames.length){
        var done = pendingSeek;
        pendingSeek = null;
        clearTimeout(done.timer);
        requestAnimationFrame(function(){requestAnimationFrame(done.resolve);});
      }
    }
  });

  window.__CBS_SET_TIME__ = function(seconds){
    return new Promise(function(resolve){
      if(window.__CBS_RENDER_ERROR__) { resolve(); return; }
      var safeSeconds = Math.max(0, Number(seconds) || 0);
      currentTimeSeconds = safeSeconds;
      var targetMs = safeSeconds * 1000;
      var token = 'seek-' + (++seekCounter);
      if(pendingSeek){ clearTimeout(pendingSeek.timer); pendingSeek.resolve(); pendingSeek = null; }
      updateVisibility(safeSeconds);
      if(characterFrames.length === 0){ requestAnimationFrame(function(){requestAnimationFrame(resolve);}); return; }
      var timer = setTimeout(function(){
        if(pendingSeek && pendingSeek.token === token){
          pendingSeek = null;
          fail('Timed out seeking source animation to ' + targetMs.toFixed(0) + ' ms');
          resolve();
        }
      }, 5000);
      pendingSeek = {token:token,targetMs:targetMs,sources:new Set(),resolve:resolve,timer:timer};
      characterFrames.forEach(function(entry){
        if(entry.frame.contentWindow){
          sendEdits(entry,safeSeconds);
          // Each layer plays its own source time (start time, clips) and loop mode, as in the editor.
          entry.frame.contentWindow.postMessage({source:'characterbazaarstudio-editor',type:'SEEK',seekMs:resolveSourceSeekMs(entry.object, safeSeconds),loop:entry.object.loopMode === 'loop',token:token}, '*');
        }
      });
    });
  };

  async function boot(){
    try{
      if(!sceneId) throw new Error('Missing scene id');
      var scene = await fetchJson('/api/scenes/' + encodeURIComponent(sceneId));
      var project = await fetchJson('/api/projects/' + encodeURIComponent(scene.project));
      var width = requestedWidth || Number(project.width || 1920);
      var height = requestedHeight || Number(project.height || 1080);
      stage.style.width = width + 'px';
      stage.style.height = height + 'px';
      // CSS zoom, not a scale transform: characters are then drawn straight onto the captured
      // pixels instead of being resampled (same as the editor stage, StageCanvas supportsStandardZoom).
      stageZoomed = supportsStandardZoom();
      if (stageZoomed) stage.style.zoom = String(captureScale);
      else stage.style.transform = 'scale(' + captureScale + ')';
      stage.style.background = (scene.editor_data && scene.editor_data.background) || '#ffffff';
      var data = scene.editor_data || {objects:[]};
      if(data.backgroundImage) addBackground(data.backgroundImage,1,1);
      var objects = Array.isArray(data.objects) ? data.objects : [];
      objects.forEach(function(object,index){
        var z = 10 + index;
        if(object.type === 'background' && object.assetKind === 'image' && object.assetUrl) addBackground(object.assetUrl,object.opacity,z);
      });
      objects.forEach(function(object,index){
        var z = 100 + index;
        if(object.type === 'background' || object.type === 'audio') return;
        if(object.type === 'character' && object.assetKind === 'animate-createjs' && object.assetUrl) addCharacter(object,z);
        else if(object.type === 'text') addText(object,z);
        else if(object.type === 'prop' && object.assetKind === 'image' && object.assetUrl) addImageLayer(object,z);
        else addProp(object,z);
      });
      updateVisibility(0);
      if(characterFrames.length === 0){
        markReadyWhenPossible();
      } else {
        setTimeout(function(){
          if(!window.__CBS_RENDER_READY__ && !window.__CBS_RENDER_ERROR__) fail('Only ' + readySources.size + '/' + characterFrames.length + ' character runtimes became ready');
        }, 20000);
      }
    }catch(error){ fail(error && error.message ? error.message : String(error)); }
  }
  boot();
})();
</script>
</body>
</html>
